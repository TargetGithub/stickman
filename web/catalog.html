<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stickman Move Catalog</title>
  <style>
    @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter.ttf"); }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px Inter, system-ui, sans-serif; background: #15161a; color: #e8e8ea; }
    header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: #1d1f24; border-bottom: 1px solid #2b2e35; }
    h1 { font-size: 15px; margin: 0 12px 0 0; }
    select, button { font: inherit; background: #2b2e35; color: inherit; border: 1px solid #3a3e47; border-radius: 4px; padding: 3px 6px; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; padding: 16px; }
    .card { background: #1d1f24; border: 1px solid #2b2e35; border-radius: 8px; overflow: hidden; }
    .card canvas { display: block; width: 100%; background: #fff; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 10px; gap: 8px; }
    .name { font-weight: 600; }
    .tags { color: #9a9ca3; font-size: 12px; }
    a { color: #7fb4ff; text-decoration: none; font-size: 12px; }
    .count { color: #9a9ca3; }
  </style>
</head>
<body>
  <header>
    <h1>Move catalog</h1>
    <label>category <select id="category"><option value="">all</option></select></label>
    <label>speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option></select></label>
    <label>scale <select id="scale"><option>0.6</option><option selected>1</option><option>2.2</option></select></label>
    <label>facing <select id="facing"><option value="1">right</option><option value="-1">left</option></select></label>
    <label><input id="hitboxes" type="checkbox" checked> hit windows</label>
    <span class="count" id="count"></span>
  </header>
  <main id="grid"></main>

  <script type="module">
    import { catalog } from "../data/index.js";
    import { prepareCatalog, CATEGORIES } from "../engine/moves.js";
    import { createActor, playMove, stepActor } from "../engine/actor.js";
    import { computeJoints, lowestPoint } from "../engine/skeleton.js";
    import { drawCharacter } from "../engine/renderer/character.js";
    import { propByKind } from "../engine/props.js";

    const $ = (id) => document.getElementById(id);
    const moves = prepareCatalog(catalog.moves, catalog.poses, catalog.props);
    function arm(actor, def) {
      if (!def.needsProp) return;
      const data = def.needsProp === "any" ? catalog.props.sword : propByKind(catalog.props, def.needsProp);
      actor.prop = { name: Object.keys(catalog.props).find((k) => catalog.props[k] === data), kind: data.kind, data };
    }
    const W = 680, H = 440, GROUND = 400, DT = 1 / 60;
    for (const c of CATEGORIES) $("category").add(new Option(c, c));

    let cards = [];
    function build() {
      $("grid").innerHTML = "";
      const facing = Number($("facing").value);
      const scale = Number($("scale").value);
      cards = [...moves.values()]
        .filter((d) => !$("category").value || d.category === $("category").value)
        .map((def) => {
          const el = document.createElement("div");
          el.className = "card";
          const params = Object.entries(def.params).map(([k, v]) => `${k}=${v}`).join(" ");
          el.innerHTML = `<canvas width="${W}" height="${H}"></canvas>
            <div class="meta"><span class="name">${def.name}</span>
            <span class="tags">${def.category} · ${def.duration}s${def.flags.loop ? " · loop" : ""}${params ? " · " + params : ""}</span>
            <a href="./editor.html?move=${def.name}">edit</a></div>`;
          $("grid").append(el);
          const loop = def.flags.loop && def.name !== "idle";
          const x0 = facing === 1 ? (loop ? 60 : W * 0.32) : (loop ? W - 60 : W * 0.68);
          const actor = createActor({ x: x0, facing, scale, groundY: GROUND });
          const card = { def, el, ctx: el.querySelector("canvas").getContext("2d"), actor, x0, wait: 0, acc: 0, joints: null, windows: [] };
          const restart = () => { actor.x = x0; arm(actor, def); playMove(actor, def.name, moves, { blend: 0 }); };
          card.restart = restart;
          restart();
          return card;
        });
      $("count").textContent = `${cards.length} moves`;
    }

    function step(card) {
      const r = stepActor(card.actor, DT, moves);
      card.joints = r.joints;
      card.windows = r.openWindows;
      const { def, actor } = card;
      if (def.flags.loop && def.name !== "idle" && (actor.x < 30 || actor.x > W - 30)) actor.x = card.x0;
      if (actor.move?.def.name === "idle" && def.name !== "idle") {
        card.wait += DT;
        if (card.wait > 0.5) { card.wait = 0; card.restart(); }
      }
    }

    function draw(card) {
      const { ctx, def, actor } = card;
      const facing = actor.facing;
      const scale = actor.scale;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#cccccc";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
      if (def.category === "attack") {
        const dx = card.x0 + facing * 150 * scale;
        const raw = computeJoints(catalog.poses.stand, { x: dx, y: 0 }, -facing, 1);
        drawCharacter(ctx, computeJoints(catalog.poses.stand, { x: dx, y: GROUND - lowestPoint(raw, 1) }, -facing, 1), { color: "#c4c4c4", scale: 1, facing: -facing });
      }
      drawCharacter(ctx, card.joints, { color: "#22aaff", scale, facing, mouth: actor.mouth, prop: actor.prop ? { data: actor.prop.data, angle: actor.propAngle } : undefined });
      if ($("hitboxes").checked) {
        for (const { hit } of card.windows) {
          const p = card.joints[hit.part];
          if (!p) continue;
          ctx.strokeStyle = "rgba(230, 40, 40, 0.9)";
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(p.x, p.y, 26 * scale, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }

    let last = null;
    function frame(ts) {
      const dt = last === null ? 0 : Math.min(0.1, (ts - last) / 1000) * Number($("speed").value);
      last = ts;
      for (const card of cards) {
        card.acc += dt;
        while (card.acc >= DT) { step(card); card.acc -= DT; }
        if (card.joints) draw(card);
      }
      requestAnimationFrame(frame);
    }

    for (const id of ["category", "scale", "facing"]) $(id).addEventListener("change", build);
    await document.fonts.ready;
    build();
    for (const c of cards) step(c);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
